type: object
additionalProperties: false
description:
  $ref: "./descriptions/NotificationSettingsView.md"
required:
  - url
  - tokenSet
  - discordWebhookUrlSet
  - onSchedule
  - onStart
  - onEnd
  - onFail
  - onRemove
properties:
  url:
    type: string
    description: 通知先 ntfy のトピックまで含む URL。空文字は ntfy への通知を無効にすることを表す。
    example: https://ntfy.sh/mirakc-rec
  tokenSet:
    type: boolean
    description: ntfy のアクセストークンが設定済みか。トークン自体は応答に含まない。
  discordWebhookUrlSet:
    type: boolean
    description: Discord の Incoming Webhook URL が設定済みか。URL 自体は応答に含まない。
  onSchedule:
    type: boolean
    description: 録画予約の登録 (キーワード自動録画と手動) を通知するか。
  onStart:
    type: boolean
    description: 録画開始を通知するか。
  onEnd:
    type: boolean
    description: 録画終了を通知するか。
  onFail:
    type: boolean
    description: 録画失敗を通知するか。
  onRemove:
    type: boolean
    description: 録画予約の削除を通知するか。
