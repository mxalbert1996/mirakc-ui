# The dev stack (Go API server + Vite dev server, started via `pnpm dev`)
# runs inside the workspace container itself, whose onCreateCommand.sh
# installs Node, pnpm and Go. The old dedicated `app` sidecar only worked
# because the Deno-based production image shipped the dev runtime inside it;
# the Go runtime image contains neither Node nor Go, so the sidecar is gone.
name: mirakc-ui

services:
  workspace:
    image: mcr.microsoft.com/devcontainers/base:trixie
    entrypoint: []
    command: ["sleep", "infinity"]
    environment:
      MIRAKC_URL: ${MIRAKC_URL}
      # 日時整形のタイムゾーン。未設定なら UTC (空文字は Etc/Unknown になるため
      # 明示デフォルトを置く)。.devcontainer/.env で TZ=Asia/Tokyo 等を指定する。
      TZ: ${TZ:-UTC}
