name: Check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

# PR は同じ ref の古い実行をキャンセルする。main への push はコミットごとに group を分け、全コミットの検証結果を残す
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  root:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # pnpm/action-setup reads the exact version from the packageManager
      # field in package.json, so the two can never drift apart.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Keep in sync with the root .node-version (also used by the
          # devcontainer) and the node base image of the Dockerfile builder.
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build before typecheck: tsc needs client/routeTree.gen.ts, a
      # gitignored artifact generated by the vite build.
      - name: Build
        run: pnpm build

      - name: Type check
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build Storybook
        run: pnpm storybook:build

      # Tracked files (pnpm-lock.yaml etc.) must not change during the job.
      - name: Check for uncommitted changes
        run: git diff --exit-code

  docs-api:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs/api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: docs/api/.node-version
          cache: npm
          cache-dependency-path: docs/api/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server-go/go.mod
          cache: false

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # client/lib/api/internal-schemas.ts が docs/api の OpenAPI から再生成した内容と一致すること
      - name: Generate client schemas
        run: |
          npm run bundle:json
          npm run emit-server-schemas -- ../../client/lib/api/internal-schemas.ts
          # oxfmt は ".." を含むパスを受け付けないため、リポジトリルートから実行する。
          cd ../..
          npx --yes oxfmt@0.77.0 client/lib/api/internal-schemas.ts

      # server-go/internal/api/types.gen.go が OpenAPI から再生成した内容と一致すること。
      # ローカルと同じ手順 (internal/api/generate.sh) を go run で再現する。
      - name: Bundle OpenAPI (refs kept)
        run: npm run build:bundle

      - name: Generate Go API types
        working-directory: server-go/internal/api
        run: |
          go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.2 \
            --config oapi-codegen.yaml ../../../docs/api/dist/api.yaml
          git diff --exit-code -- types.gen.go

      - name: Check for uncommitted changes
        run: git diff --exit-code

  server-go:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server-go
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server-go/go.mod
          cache: true
          cache-dependency-path: server-go/go.sum

      - name: Check formatting
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # ubuntu ランナーには ffmpeg が入っているため実 ffmpeg プローブテストも走る
      - name: Test
        run: go test -race ./...
